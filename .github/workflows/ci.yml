name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests receive read-only permissions and never receive the GitHub API token.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm scan:secrets
      - name: Independent secret scan (Gitleaks 8.30.1)
        shell: bash
        run: |
          SCAN_DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$SCAN_DIR"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$SCAN_DIR/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$SCAN_DIR/checksums.txt"
          (cd "$SCAN_DIR" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$SCAN_DIR/gitleaks_8.30.1_linux_x64.tar.gz" -C "$SCAN_DIR"
          "$SCAN_DIR/gitleaks" git . --log-opts=--all --redact --no-banner
          "$SCAN_DIR/gitleaks" dir . --redact --no-banner
      - run: pnpm audit:security
      - name: Production liveness smoke check
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/repo-insights-start.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              curl --fail --silent http://127.0.0.1:3000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/repo-insights-start.log
          exit 1
